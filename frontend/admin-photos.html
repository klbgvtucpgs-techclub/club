<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manage Photos · VTU Clubs Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  /* ---- page-level layout ---- */
  .ap-wrap{max-width:1160px;margin:0 auto;padding:0 20px}
  .ap-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:36px 0 24px}
  .ap-header h2{font-family:"Playfair Display",serif;font-size:clamp(1.5rem,3vw,2.1rem);margin:0}
  .ap-header p{color:var(--muted);margin:4px 0 0;font-size:.95rem}
  .ap-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  /* ---- toast / error ---- */
  .ap-toast{padding:12px 20px;border-radius:var(--r);margin-bottom:18px;font-weight:600;display:none}
  .ap-toast.show{display:block}
  .ap-toast.ok{background:rgba(80,200,120,.18);border:1px solid rgba(80,200,120,.5);color:#6fffa6}
  .ap-toast.err{background:rgba(255,80,80,.14);border:1px solid rgba(255,80,80,.45);color:#ff8080}

  /* ---- filters ---- */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
  .chip{min-height:36px;padding:0 16px;border-radius:999px;border:1px solid rgba(245,185,66,.45);background:none;
        color:var(--text);font:600 .85rem inherit;cursor:pointer;transition:background .2s,color .2s}
  .chip[aria-pressed="true"],.chip:hover{background:var(--gold);color:#1a0d00;border-color:var(--gold)}

  /* ---- gallery grid matching public gallery ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;margin-bottom:28px}

  /* photo card – same as .ph.tilt on main gallery */
  .ph{position:relative;border-radius:var(--r);overflow:hidden;background:var(--surf);aspect-ratio:4/3;cursor:default;
      box-shadow:0 4px 24px rgba(0,0,0,.45);transition:transform .18s,box-shadow .18s}
  .ph:hover{transform:translateY(-4px) scale(1.015);box-shadow:0 10px 36px rgba(0,0,0,.65)}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
  .ph:hover img{transform:scale(1.06)}

  /* club badge */
  .ph-badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);
            color:var(--gold);font:700 .72rem "Source Sans 3";padding:3px 10px;border-radius:999px;text-transform:uppercase;
            letter-spacing:.06em;border:1px solid rgba(245,185,66,.35);z-index:2}

  /* title/event overlay */
  .ph-meta{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.88));
           padding:28px 14px 14px;display:flex;flex-direction:column;gap:2px;z-index:2}
  .ph-meta strong{font-size:.9rem;line-height:1.3;color:#fff;text-shadow:0 1px 6px #000}
  .ph-meta small{font-size:.75rem;color:var(--muted)}

  /* action buttons on card */
  .ph-actions{position:absolute;top:10px;right:10px;display:flex;gap:6px;opacity:0;transition:opacity .2s;z-index:3}
  .ph:hover .ph-actions{opacity:1}
  .ph-btn{min-height:30px;padding:0 10px;border-radius:999px;border:none;font:600 .75rem inherit;cursor:pointer;
          display:inline-flex;align-items:center;gap:4px;transition:transform .15s,opacity .15s}
  .ph-btn.view{background:rgba(255,255,255,.2);backdrop-filter:blur(6px);color:#fff}
  .ph-btn.edit{background:rgba(245,185,66,.9);color:#1a0d00}
  .ph-btn.del{background:rgba(255,60,60,.85);color:#fff}
  .ph-btn:hover{transform:scale(1.08)}
  .ph-btn:disabled{opacity:.45;cursor:not-allowed}

  /* ---- empty / loading state ---- */
  .ap-empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:1.1rem;grid-column:1/-1}
  .spinner{width:36px;height:36px;border:4px solid var(--surf);border-top-color:var(--gold);border-radius:50%;
           animation:spin .7s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- pager ---- */
  .pager{display:flex;align-items:center;gap:14px;justify-content:center;margin:28px 0 48px;flex-wrap:wrap}
  .pager span{color:var(--muted);font-size:.9rem}

  /* ---- dialogs ---- */
  dialog{background:#15101a;border:1px solid rgba(245,185,66,.35);border-radius:var(--r);color:var(--text);
         padding:28px;max-width:min(680px,94vw);width:100%;box-shadow:0 24px 80px #000;box-sizing:border-box}
  dialog::backdrop{background:rgba(0,0,0,.85);backdrop-filter:blur(4px)}
  dialog .dlg-close{position:absolute;top:14px;right:14px}
  #dlg-img-ap{max-width:100%;max-height:60vh;object-fit:contain;border-radius:12px;display:block;margin:0 auto 14px}
  
  /* Form fields in dialog */
  .dialog-form label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--muted)}
  .dialog-form input, .dialog-form select{width:100%;padding:10px 14px;border-radius:10px;background:var(--surf);border:1px solid rgba(255,255,255,.15);color:var(--text);font:inherit;margin-bottom:14px;box-sizing:border-box}
  .dialog-form input:focus, .dialog-form select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  .dialog-form select option{background:#1c1424;color:#fff}
</style>
</head>
<body>

<!-- ==================== HEADER ==================== -->
<header><div class="wrap"><div class="bar">
 <a class="brand" href="index.html#home" aria-label="VTU Clubs home">
  <img src="assets/images/logo.webp" alt="VTU logo">
  <span>VTU Club Cluster<small>Admin · Photo Manager</small></span>
 </a>
 <nav aria-label="Main">
  <a href="index.html#home">Home</a>
  <a href="index.html#gallery">Gallery</a>
  <a href="index.html#admin">Dashboard</a>
 </nav>
</div></div></header>

<!-- ==================== MAIN ==================== -->
<main>
<div class="ap-wrap">

  <!-- page header -->
  <div class="ap-header">
    <div>
      <h2>Manage Gallery Photos</h2>
      <p>Moments from all five clubs. Preview, edit details, or permanently delete photos.</p>
    </div>
    <div class="ap-actions">
      <a href="index.html#admin" class="btn" id="btn-upload-new">+ Upload New Photo</a>
      <a href="index.html#admin" class="btn ghost">&larr; Back to Dashboard</a>
    </div>
  </div>

  <!-- toasts -->
  <div class="ap-toast" id="ap-ok" role="status"></div>
  <div class="ap-toast" id="ap-err" role="alert"></div>

  <!-- club filter chips -->
  <div class="filters" role="group" aria-label="Filter photos by club">
    <button class="chip" data-club="all" aria-pressed="true">All</button>
    <button class="chip" data-club="tech"       aria-pressed="false">Tech-Kosh</button>
    <button class="chip" data-club="sports"     aria-pressed="false">Sports</button>
    <button class="chip" data-club="culture"    aria-pressed="false">Culture</button>
    <button class="chip" data-club="multimedia" aria-pressed="false">Multi Media</button>
    <button class="chip" data-club="management" aria-pressed="false">Management</button>
  </div>

  <!-- photo grid -->
  <div class="grid" id="ap-grid">
    <div class="ap-empty"><div class="spinner"></div>Loading photos…</div>
  </div>

  <!-- pager -->
  <div class="pager" id="ap-pager" hidden>
    <button class="chip" id="ap-prev">&#8592; Previous</button>
    <span id="ap-label" aria-live="polite">Page 1 of 1</span>
    <button class="chip" id="ap-next">Next &#8594;</button>
  </div>

</div>
</main>

<!-- ==================== FOOTER ==================== -->
<footer>&copy; 2026 VTU Clubs &middot; <a href="https://my-doc-makeover.vercel.app">Varun Kumar</a></footer>

<!-- ==================== PREVIEW DIALOG ==================== -->
<dialog id="ap-dlg" aria-modal="true" aria-labelledby="ap-dlg-title">
  <button class="btn ghost dlg-close" id="ap-dlg-close" style="position:absolute;top:14px;right:14px">Close</button>
  <h3 id="ap-dlg-title" style="font-family:'Playfair Display',serif;margin:0 0 16px"></h3>
  <img id="dlg-img-ap" src="" alt="">
  <p id="ap-dlg-sub" style="color:var(--muted);font-size:.9rem;margin:0"></p>
</dialog>

<!-- ==================== EDIT DIALOG ==================== -->
<dialog id="ap-edit-dlg" aria-modal="true" aria-labelledby="ap-edit-title">
  <button class="btn ghost dlg-close" id="ap-edit-close" style="position:absolute;top:14px;right:14px">Close</button>
  <h3 id="ap-edit-title" style="font-family:'Playfair Display',serif;margin:0 0 18px">Edit Photo Details</h3>
  <form id="ap-edit-form" class="dialog-form" novalidate>
    <input type="hidden" id="edit-id">
    <div>
      <label for="edit-title">Title</label>
      <input id="edit-title" required maxlength="150" placeholder="e.g. Robowar Champions 2026">
    </div>
    <div>
      <label for="edit-event">Event name</label>
      <input id="edit-event" maxlength="150" placeholder="e.g. Tech-Fest Finale">
    </div>
    <div>
      <label for="edit-club">Club</label>
      <select id="edit-club">
        <option value="tech">Tech-Kosh</option>
        <option value="sports">Sports</option>
        <option value="culture">Culture</option>
        <option value="multimedia">Multi Media</option>
        <option value="management">Management</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px">
      <button type="button" class="btn ghost" id="ap-edit-cancel">Cancel</button>
      <button type="submit" class="btn" id="ap-edit-save">Save Changes</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  "use strict";

  /* ===================== CONFIG ===================== */
  var API = "";               // same-origin; set to backend URL if separated
  var PAGE_SIZE = 8;

  /* ===================== STATE ===================== */
  var csrf = "";
  var currentClub = "all";
  var currentPage = 1;
  var totalPages  = 1;
  var currentPhotos = [];

  /* ===================== HELPERS ===================== */
  function $(id) { return document.getElementById(id); }
  function toast(msg, ok) {
    var t = ok ? $("ap-ok") : $("ap-err");
    var o = ok ? $("ap-err") : $("ap-ok");
    o.className = "ap-toast"; o.textContent = "";
    t.textContent = msg;
    t.className = "ap-toast show " + (ok ? "ok" : "err");
    setTimeout(function () { t.className = "ap-toast"; }, 4500);
  }

  /* ===================== SESSION CHECK ===================== */
  function checkSession() {
    return fetch(API + "/api/admin/me", { credentials: "include" })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) {
          window.location.href = "index.html#admin";
          return null;
        }
        return r.json();
      })
      .then(function (d) {
        if (!d) return null;
        csrf = d.csrf_token || "";
        sessionStorage.setItem("ap_csrf", csrf);
        return d;
      })
      .catch(function () {
        window.location.href = "index.html#admin";
        return null;
      });
  }

  /* ===================== LOAD PHOTOS ===================== */
  function loadPhotos() {
    var grid = $("ap-grid");
    grid.innerHTML = '<div class="ap-empty"><div class="spinner"></div>Loading photos\u2026</div>';

    var url = API + "/api/gallery?page=" + currentPage + "&page_size=" + PAGE_SIZE;
    if (currentClub !== "all") url += "&club=" + encodeURIComponent(currentClub);

    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        currentPhotos = data.items || [];
        renderGrid(currentPhotos);
        var total = data.total || 0;
        totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        updatePager();
      })
      .catch(function (e) {
        grid.innerHTML = '<div class="ap-empty">Could not load photos. Is the server running?</div>';
        toast("Error loading photos: " + e.message, false);
      });
  }

  /* ===================== RENDER GRID ===================== */
  function clubLabel(slug) {
    var map = { tech:"Tech-Kosh", sports:"Sports", culture:"Culture", multimedia:"Multi Media", management:"Management" };
    return map[slug] || slug;
  }

  function renderGrid(photos) {
    var grid = $("ap-grid");
    if (!photos.length) {
      grid.innerHTML = '<div class="ap-empty">No photos found for this filter.</div>';
      return;
    }
    grid.innerHTML = "";
    photos.forEach(function (p) {
      var card = document.createElement("div");
      card.className = "ph";
      card.dataset.id = p.id;

      var img = document.createElement("img");
      img.src = p.image_url;
      img.alt = p.title;
      img.loading = "lazy";

      var badge = document.createElement("div");
      badge.className = "ph-badge";
      badge.textContent = clubLabel(p.club_slug);

      var meta = document.createElement("div");
      meta.className = "ph-meta";
      var strong = document.createElement("strong");
      strong.textContent = p.title;
      var small = document.createElement("small");
      small.textContent = p.event_name || formatDate(p.uploaded_at);
      meta.appendChild(strong);
      meta.appendChild(small);

      var actions = document.createElement("div");
      actions.className = "ph-actions";

      var viewBtn = document.createElement("button");
      viewBtn.className = "ph-btn view";
      viewBtn.textContent = "View";
      viewBtn.type = "button";
      viewBtn.setAttribute("aria-label", "Preview " + p.title);
      viewBtn.addEventListener("click", function (e) { e.stopPropagation(); openPreview(p); });

      var editBtn = document.createElement("button");
      editBtn.className = "ph-btn edit";
      editBtn.textContent = "Edit";
      editBtn.type = "button";
      editBtn.setAttribute("aria-label", "Edit " + p.title);
      editBtn.addEventListener("click", function (e) { e.stopPropagation(); openEdit(p); });

      var delBtn = document.createElement("button");
      delBtn.className = "ph-btn del";
      delBtn.textContent = "Delete";
      delBtn.type = "button";
      delBtn.setAttribute("aria-label", "Delete " + p.title);
      delBtn.addEventListener("click", function (e) { e.stopPropagation(); deletePhoto(p.id, p.title, card, delBtn); });

      actions.appendChild(viewBtn);
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);

      card.appendChild(img);
      card.appendChild(badge);
      card.appendChild(meta);
      card.appendChild(actions);
      grid.appendChild(card);
    });
  }

  /* ===================== PAGER ===================== */
  function updatePager() {
    var pager = $("ap-pager");
    pager.hidden = totalPages <= 1;
    $("ap-label").textContent = "Page " + currentPage + " of " + totalPages;
    $("ap-prev").disabled = currentPage <= 1;
    $("ap-next").disabled = currentPage >= totalPages;
  }

  $("ap-prev").addEventListener("click", function () {
    if (currentPage > 1) { currentPage--; loadPhotos(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  });
  $("ap-next").addEventListener("click", function () {
    if (currentPage < totalPages) { currentPage++; loadPhotos(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  });

  /* ===================== CLUB FILTER ===================== */
  document.querySelectorAll("[data-club]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("[data-club]").forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
      btn.setAttribute("aria-pressed", "true");
      currentClub = btn.dataset.club;
      currentPage = 1;
      loadPhotos();
    });
  });

  /* ===================== EDIT PHOTO ===================== */
  function openEdit(p) {
    $("edit-id").value = p.id;
    $("edit-title").value = p.title || "";
    $("edit-event").value = p.event_name || "";
    $("edit-club").value = p.club_slug || "tech";
    $("ap-edit-dlg").showModal();
  }

  $("ap-edit-close").addEventListener("click", function () { $("ap-edit-dlg").close(); });
  $("ap-edit-cancel").addEventListener("click", function () { $("ap-edit-dlg").close(); });
  $("ap-edit-dlg").addEventListener("click", function (e) { if (e.target === $("ap-edit-dlg")) $("ap-edit-dlg").close(); });

  $("ap-edit-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var id = $("edit-id").value;
    var title = $("edit-title").value.trim();
    var eventName = $("edit-event").value.trim();
    var clubSlug = $("edit-club").value;
    if (!title) { toast("Please enter a title.", false); return; }

    var saveBtn = $("ap-edit-save");
    saveBtn.disabled = true;
    saveBtn.textContent = "Saving…";

    var csrfVal = csrf || sessionStorage.getItem("ap_csrf") || "";

    fetch(API + "/api/admin/photos/" + encodeURIComponent(id), {
      method: "PATCH",
      credentials: "include",
      headers: {
        "Content-Type": "application/json",
        "X-CSRF-Token": csrfVal
      },
      body: JSON.stringify({
        title: title,
        event_name: eventName,
        club_slug: clubSlug
      })
    })
    .then(function (r) {
      if (!r.ok) return r.json().then(function (d) { throw new Error(d.detail || "Update failed (" + r.status + ")"); });
      return r.json();
    })
    .then(function (updated) {
      $("ap-edit-dlg").close();
      toast('Photo "' + updated.title + '" updated successfully.', true);
      loadPhotos();
    })
    .catch(function (err) {
      toast(err.message, false);
    })
    .finally(function () {
      saveBtn.disabled = false;
      saveBtn.textContent = "Save Changes";
    });
  });

  /* ===================== DELETE PHOTO ===================== */
  function deletePhoto(id, title, card, btn) {
    if (!confirm('Delete "' + title + '" permanently?\n\nThis cannot be undone.')) return;
    btn.disabled = true;
    btn.textContent = "Deleting…";

    var csrfVal = csrf || sessionStorage.getItem("ap_csrf") || "";

    fetch(API + "/api/admin/photos/" + encodeURIComponent(id), {
      method: "DELETE",
      credentials: "include",
      headers: { "X-CSRF-Token": csrfVal }
    })
    .then(function (r) {
      if (!r.ok) return r.json().then(function (d) { throw new Error(d.detail || "Delete failed (" + r.status + ")"); });
      return r.json();
    })
    .then(function () {
      card.style.transition = "opacity .3s, transform .3s";
      card.style.opacity = "0";
      card.style.transform = "scale(.92)";
      setTimeout(function () {
        card.remove();
        var remaining = document.querySelectorAll("#ap-grid .ph").length;
        if (remaining === 0 && currentPage > 1) { currentPage--; }
        loadPhotos();
      }, 300);
      toast('"' + title + '" deleted successfully.', true);
    })
    .catch(function (e) {
      btn.disabled = false;
      btn.textContent = "Delete";
      toast(e.message, false);
    });
  }

  /* ===================== PREVIEW DIALOG ===================== */
  function formatDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }

  function openPreview(p) {
    $("ap-dlg-title").textContent = p.title;
    $("dlg-img-ap").src = p.image_url;
    $("dlg-img-ap").alt = p.title;
    var parts = [];
    if (p.event_name) parts.push(p.event_name);
    if (p.club_name) parts.push(p.club_name);
    if (p.uploaded_at) parts.push("Uploaded " + formatDate(p.uploaded_at));
    $("ap-dlg-sub").textContent = parts.join(" · ");
    $("ap-dlg").showModal();
  }

  $("ap-dlg-close").addEventListener("click", function () { $("ap-dlg").close(); });
  $("ap-dlg").addEventListener("click", function (e) { if (e.target === $("ap-dlg")) $("ap-dlg").close(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") $("ap-dlg").close(); });

  /* ===================== BOOT ===================== */
  checkSession().then(function (session) {
    if (!session) return;
    loadPhotos();
  });

})();
</script>
</body>
</html>
